<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The tab icon: the site's own mark from `components/ui/logo.tsx` — two stems
    with rounded caps and the crossbar that curves rather than sits flat — on
    the cream canvas the rest of the site uses.

    Three things differ from the header, all because 16px is not 36px.

    The stroke is 7 rather than 5: at the header's weight it renders about 1.1px
    in a tab and goes faint and grey.

    The mark is placed from its *stroked* bounds rather than its path box, so it
    sits optically centred instead of drifting up and left by half a stroke.

    And the gold is `gold-600` (#B08F4E), matching the header mark rather than
    the lighter base `gold`. Rendered at true 16px and inspected, the base gold
    on cream washes out to a suggestion of a letter; the deeper shade holds its
    shape. The alternative that reads strongest is gold on an ink tile — kept in
    reserve, since it trades the cream identity for legibility.

    Geometry is otherwise the brand sheet's: stems at x=6 and x=42 over a 48x52
    field, crossbar cut short of each stem, uniform weight.
  -->
  <rect width="64" height="64" rx="12" fill="#F6F3EE" />
  <g
    transform="translate(10.28 6.87) scale(0.8627)"
    stroke="#B08F4E"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  >
    <path d="M6 4v44" />
    <path d="M42 4v44" />
    <path d="M11.5 27C17 24.5 31 24.5 36.5 27" />
  </g>
</svg>
